version: 2
updates:
  # npm ecosystem reads pnpm-lock.yaml across the workspace.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/tooling bumps into one PR to cut noise.
      dev-dependencies:
        dependency-type: development
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keeps the digest-pinned base/sidecar images (Dockerfiles + docker-compose.yml)
  # from going stale on security updates.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/docker"
      - "/iot-helper"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
