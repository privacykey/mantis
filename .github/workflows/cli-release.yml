# Builds the mantis CLI as standalone binaries (one bun --compile per
# target on its own native runner — this is required because the CLI
# depends on @napi-rs/keyring, whose platform-specific .node files are
# published as separate npm packages and only resolve correctly on a
# matching host).
#
# Publishes the four tarballs as a GitHub release and opens a PR on
# privacykey/homebrew-tap to bump Formula/mantis.rb.
#
# Triggers:
#   - Bump the `version` in `cli/package.json` on `main` — the resolve
#     job derives the tag from the new version and releases if the tag
#     doesn't already exist on the remote. This is the recommended flow.
#   - Push a tag matching `cli-v*` (e.g. `cli-v0.1.0`) — releases that
#     exact tag.
#   - Manually run the workflow from the Actions tab — optionally pass
#     a `tag` input to override; leave blank to use cli/package.json.
#
# Requires repo secret HOMEBREW_TAP_TOKEN — a fine-grained PAT with
# Contents + Pull requests read & write on privacykey/homebrew-tap.

name: Release CLI

on:
  push:
    branches:
      - main
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. cli-v0.1.x). Leave blank to read the version from cli/package.json."
        required: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      should_release: ${{ steps.compute.outputs.should_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compute version + tag
        id: compute
        shell: bash
        # Pass GitHub context through env, not ${{ }} interpolation into the
        # script body — a crafted workflow_dispatch `tag` input would otherwise
        # execute in the runner before the cli-v* validation below runs.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Three entry points, in priority order:
          #   1. workflow_dispatch with explicit tag input  → use that tag.
          #   2. Push of a cli-v* tag                       → use that tag.
          #   3. Push to main (or workflow_dispatch w/o tag)→ read version
          #      from cli/package.json and synthesise the tag.
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
            SOURCE="workflow_dispatch input"
          elif [[ "$REF" == refs/tags/cli-v* ]]; then
            TAG="$REF_NAME"
            SOURCE="tag push"
          else
            VERSION="$(jq -r .version cli/package.json)"
            if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
              echo "::error::cli/package.json is missing a version field"
              exit 1
            fi
            TAG="cli-v${VERSION}"
            SOURCE="cli/package.json bump (version=${VERSION})"
          fi

          if [[ "$TAG" != cli-v* ]]; then
            echo "::error::Tag must start with 'cli-v' (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#cli-v}"

          # For branch pushes / dispatch from cli/package.json, apply two
          # guards. Tag pushes are explicit user intent and bypass both.
          SHOULD_RELEASE=true
          if [[ "$REF" != refs/tags/cli-v* ]]; then
            # Guard 1 (idempotency): tag already exists on the remote → the
            # version wasn't actually bumped, or this release was already
            # cut. Silently skip.
            if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on origin — no release needed."
              SHOULD_RELEASE=false
            else
              # Guard 2 (regression): the new version must be strictly higher
              # than the highest already-released cli-v* tag. Uses `sort -V`
              # so 0.1.10 > 0.1.9 compares correctly. Tag pushes bypass this
              # so you can still re-release an older version intentionally.
              HIGHEST_VERSION="$(git ls-remote --tags origin 'refs/tags/cli-v*' \
                | awk -F/ '{print $NF}' \
                | grep -v '\^{}$' \
                | sed 's/^cli-v//' \
                | sort -V \
                | tail -n1)"
              if [[ -n "$HIGHEST_VERSION" ]]; then
                WINNER="$(printf '%s\n%s\n' "$VERSION" "$HIGHEST_VERSION" | sort -V | tail -n1)"
                if [[ "$WINNER" != "$VERSION" ]]; then
                  echo "::error::Refusing to release ${TAG}: ${VERSION} is older than the latest released cli-v${HIGHEST_VERSION}. Bump cli/package.json to a version greater than ${HIGHEST_VERSION}, or push a cli-v* tag explicitly if you really mean to re-release an older line."
                  exit 1
                fi
              fi
            fi
          fi

          echo "Resolved: tag=${TAG} version=${VERSION} should_release=${SHOULD_RELEASE} (source: ${SOURCE})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build mantis-${{ matrix.target }}
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "25.8.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Pin CLI_VERSION to release version
        shell: bash
        run: |
          printf 'export const CLI_VERSION = "%s";\n' "${{ needs.resolve.outputs.version }}" > cli/src/version.ts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install CLI dependencies (host-native bindings)
        run: pnpm install --frozen-lockfile

      - name: Compile binary for ${{ matrix.target }}
        working-directory: cli
        shell: bash
        run: |
          mkdir -p dist/bin
          bun build \
            --compile \
            --minify \
            --sourcemap=none \
            --target=bun-${{ matrix.target }} \
            --outfile dist/bin/mantis \
            src/index.ts

      - name: Package tarball
        working-directory: cli
        shell: bash
        run: |
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/share/man/man1"
          cp dist/bin/mantis "$STAGE/mantis"
          # Substitute the version placeholder in the man page header.
          sed "s/__MANTIS_VERSION__/${{ needs.resolve.outputs.version }}/g" \
            share/man/man1/mantis.1 > "$STAGE/share/man/man1/mantis.1"
          tar -C "$STAGE" -czf "dist/bin/mantis-${{ matrix.target }}.tar.gz" mantis share

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantis-${{ matrix.target }}
          path: cli/dist/bin/mantis-${{ matrix.target }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [resolve, build]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      sha_darwin_arm64: ${{ steps.shas.outputs.darwin_arm64 }}
      sha_darwin_x64: ${{ steps.shas.outputs.darwin_x64 }}
      sha_linux_arm64: ${{ steps.shas.outputs.linux_arm64 }}
      sha_linux_x64: ${{ steps.shas.outputs.linux_x64 }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256s
        id: shas
        working-directory: artifacts
        run: |
          ls -la
          shasum -a 256 mantis-*.tar.gz | tee SHA256SUMS
          for tgt in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            sha=$(shasum -a 256 "mantis-${tgt}.tar.gz" | awk '{print $1}')
            key="${tgt//-/_}"
            echo "${key}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          NOTES=$(cat <<'EOF'
          Standalone CLI binaries for macOS and Linux on arm64 / x86_64. Each binary is built on its own native runner so the bundled native modules (`@napi-rs/keyring`) match the target.

          ### Install via Homebrew

          ```
          brew install privacykey/tap/mantis
          ```

          ### Or download directly

          Pick the tarball for your platform below, extract it, and put the `mantis` binary on your `$PATH`.
          EOF
          )
          # --target pins the tag to the commit that triggered this run. For
          # tag pushes the tag already exists at that SHA (no-op); for branch
          # pushes (version-bump trigger) this creates the tag.
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "mantis CLI $VERSION" \
            --notes "$NOTES" \
            artifacts/mantis-darwin-arm64.tar.gz \
            artifacts/mantis-darwin-x64.tar.gz \
            artifacts/mantis-linux-arm64.tar.gz \
            artifacts/mantis-linux-x64.tar.gz \
            artifacts/SHA256SUMS

  bump-homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HOMEBREW_TAP_TOKEN is set
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            cat >&2 <<'EOF'
          ::error::HOMEBREW_TAP_TOKEN secret is not configured on this repo.
          Create a fine-grained PAT with 'Contents: read & write' and
          'Pull requests: read & write' on privacykey/homebrew-tap, then add
          it as the HOMEBREW_TAP_TOKEN repo secret here. The release itself
          has already succeeded — just configure the token and re-run this job.
          EOF
            exit 1
          fi

      - name: Checkout privacykey/homebrew-tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: privacykey/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate Formula/mantis.rb
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA_DARWIN_ARM64: ${{ needs.release.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ needs.release.outputs.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ needs.release.outputs.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ needs.release.outputs.sha_linux_x64 }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/mantis.rb <<EOF
          # AUTO-GENERATED by privacykey/mantis cli-release workflow.
          # Manual edits will be overwritten on the next release.
          class Mantis < Formula
            desc "Command-line client for Mantis — manage keys and watch hits from the terminal"
            homepage "https://github.com/privacykey/mantis"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/privacykey/mantis/releases/download/cli-v#{version}/mantis-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/privacykey/mantis/releases/download/cli-v#{version}/mantis-darwin-x64.tar.gz"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/privacykey/mantis/releases/download/cli-v#{version}/mantis-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/privacykey/mantis/releases/download/cli-v#{version}/mantis-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "mantis"
              man1.install "share/man/man1/mantis.1"

              # Shell completions — \`mantis completion <shell>\` writes a ready-to-source
              # script. Homebrew adds these directories to fpath / bash-completion / fish
              # completion path automatically.
              (bash_completion/"mantis").write Utils.safe_popen_read(bin/"mantis", "completion", "bash")
              (zsh_completion/"_mantis").write Utils.safe_popen_read(bin/"mantis", "completion", "zsh")
              (fish_completion/"mantis.fish").write Utils.safe_popen_read(bin/"mantis", "completion", "fish")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mantis --version")
              assert_match "#compdef mantis", (zsh_completion/"_mantis").read
              assert_match "MANTIS 1", (man1/"mantis.1").read
            end
          end
          EOF

      - name: Commit + open PR on the tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          BRANCH="bump-mantis-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/mantis.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${VERSION} — nothing to do."
            exit 0
          fi
          git commit -m "mantis ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "mantis ${VERSION}" \
            --body "Auto-generated by https://github.com/privacykey/mantis release workflow for tag \`${TAG}\`." \
            --base main \
            --head "$BRANCH"
