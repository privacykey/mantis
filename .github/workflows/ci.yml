name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck (server + cli + edge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "25.8.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck all packages
        run: pnpm run check

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mantis
          POSTGRES_PASSWORD: mantis
          POSTGRES_DB: mantis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mantis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mantis:mantis@localhost:5432/mantis_test
      PUBLIC_BASE_URL: http://localhost:3000
      MANTIS_API_KEY_PEPPER: ci-only-pepper-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "25.8.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: migrate
        run: pnpm run db:migrate
      - name: test
        run: pnpm test
      # Full-stack integration tests run the real route handlers against the
      # Postgres service container above (migrations already applied). The
      # suite's globalSetup re-applies migrations idempotently.
      - name: integration tests (real Postgres)
        run: pnpm run test:integration
      # Tier-2 e2e: production `next build` + the standalone server entrypoint
      # (node .next/standalone/server.js) hit over real HTTP. Covers the two
      # things handler-level tests cannot see — the proxy host-split as applied
      # by the runtime matcher, and the wire-level Set-Cookie Secure attribute.
      # Reuses this job's Postgres service instead of spawning Docker.
      - name: tier-2 e2e (standalone server, real HTTP)
        run: pnpm run test:tier2
        env:
          MANTIS_TIER2_USE_EXISTING_DB: "1"

  build:
    name: next build (catches lint/build-time errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build doesn't need a live DB but does need these to be defined.
      DATABASE_URL: postgres://placeholder/placeholder
      PUBLIC_BASE_URL: http://localhost:3000
      MANTIS_API_KEY_PEPPER: ci-only-pepper-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "25.8.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm run build

  cli-artifact:
    name: CLI build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "25.8.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build CLI
        run: pnpm --filter @mantis/cli run build
      - name: smoke test CLI
        run: node cli/dist/index.js --version
      - name: upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantis-cli-dist
          path: cli/dist/
          if-no-files-found: error

  audit:
    name: dependency audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "25.8.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      # Fails the build on a HIGH/critical advisory in production deps. The
      # pnpm-workspace.yaml overrides patch known transitive CVEs; this catches
      # the next one. Moderates are tracked by Dependabot rather than blocking.
      - name: audit
        run: pnpm audit --prod --audit-level=high
