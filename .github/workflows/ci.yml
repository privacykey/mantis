name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck (server + cli + edge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
            mantis-edge/package-lock.json
      - name: install (root)
        run: npm ci
      - name: install (cli)
        run: npm --prefix cli ci || npm --prefix cli install --package-lock-only && npm --prefix cli ci
      - name: install (mantis-edge)
        run: npm --prefix mantis-edge ci || npm --prefix mantis-edge install --package-lock-only && npm --prefix mantis-edge ci
      - name: typecheck all three
        run: npm run check

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mantis
          POSTGRES_PASSWORD: mantis
          POSTGRES_DB: mantis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mantis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mantis:mantis@localhost:5432/mantis_test
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: install
        run: npm ci
      - name: migrate
        run: npm run db:migrate
      - name: test
        run: npm test

  build:
    name: next build (catches lint/build-time errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build doesn't need a live DB but does need these to be defined.
      DATABASE_URL: postgres://placeholder/placeholder
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: install
        run: npm ci
      - name: build
        run: npm run build
