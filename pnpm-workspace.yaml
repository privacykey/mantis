packages:
  - "."
  - "cli"
  - "mantis-edge"
  - "iot-helper"
  - "bench/edge"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Force vulnerable transitive deps past their patched versions:
#   postcss <8.5.10  → XSS via unescaped </style> in CSS Stringify
#   esbuild <0.25.0  → dev server CORS bypass (CVE)
#   joi <17.13.4     → uncaught RangeError on deep recursive link() schemas
#                      (pulled in transitively via passkit-generator)
overrides:
  postcss: ^8.5.10
  esbuild: ^0.25.0
  joi: ^17.13.4
