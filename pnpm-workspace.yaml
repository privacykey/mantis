packages:
  - "."
  - "cli"
  - "mantis-edge"
  - "iot-helper"
  - "bench/edge"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Force vulnerable transitive deps to patched versions:
#   nanoid@3 <3.3.17 → custom alphabets with a zero/negative size loop forever
#                      instead of returning (GHSA-2v37-7h3g-55p8). Reaches prod
#                      only via postcss (both @tailwindcss/postcss and next pin
#                      nanoid ^3.3.x), where sizes are internal constants, so it
#                      is not reachable from our own code — pinned to clear the
#                      audit and because a build-time infinite loop is nasty.
#                      NOTE the `nanoid@3` key, same reasoning as undici@7
#                      below: the app's own dependency is nanoid ^6, so a bare
#                      `nanoid:` override would drag it back onto the 3.x line.
#   postcss <8.5.10  → XSS via unescaped </style> in CSS Stringify (GHSA-qx2v-qp2m-jg93)
#   esbuild <0.28.1  → Deno binary-integrity RCE (GHSA-gv7w-rqvm-qjhr); also clears the
#                      Windows dev-server path traversal (GHSA-g7r4-m6w7-qqqr) and the older
#                      dev-server CORS bypass (GHSA-67mh-4wv8-2f99). Build-time devDep only.
#   joi <17.13.4     → uncaught RangeError on deep recursive link() schemas (GHSA-q7cg-457f-vx79)
#                      (pulled in transitively via passkit-generator; ^17.x stays off the
#                      separate 18.0.0–18.2.0 vulnerable branch)
#   ws <8.20.1       → uninitialized memory disclosure via close() reason TypedArray
#                      (GHSA-58qx-3vcg-4xpx); pulled in via miniflare's exact 8.18.0 pin
#   uuid <11.1.1     → v3/v5/v6 missing output-buffer bounds check (GHSA-w5hq-g745-h8pq);
#                      ^11.x deliberately avoids the re-vulnerable 12.0.0 / 13.0.0. Bench-only dep.
#   form-data <4.0.6 → CRLF injection via unescaped multipart field names/filenames
#                      (GHSA-hmw2-7cc7-3qxx); pulled in transitively via autocannon. Bench-only dep.
#   vite <8.0.16     → server.fs.deny bypass via Windows alternate paths (GHSA-fx2h-pf6j-xcff)
#                      and launch-editor NTLMv2 hash disclosure via UNC paths (GHSA-v6wh-96g9-6wx3),
#                      both Windows-only dev-server issues. Pulled in transitively via vitest; we
#                      never run the vite dev server (Next.js serves the app), so not exploitable
#                      here — pinned for hygiene / to clear the alerts. Test-time devDep only.
#   sharp <0.35.0    → inherited libvips heap overflows / OOB reads (GHSA-f88m-g3jw-g9cj:
#                      CVE-2026-33327/33328/35590/35591); optional dep of next (image
#                      optimization) which pins ^0.34.5, so forced here.
#   undici@7 <7.29.0 → the 7.x HTTP-cache/cookie/retry cluster: private-cache directive
#                      crash + cross-user disclosure (GHSA-4cwx-7wf7-3272, high),
#                      Cache-Control whitespace disclosure (GHSA-jr45-8vmc-qm54), retry
#                      interceptor response desync (GHSA-8xcm-r25x-g524), setCookie
#                      attribute injection (GHSA-v3r7-h72x-cjcm) and blob `type` CRLF
#                      injection (GHSA-m8rv-5g2x-5cg5). NOTE the `undici@7` key: the
#                      app's own dependency is undici ^8, which these advisories cover
#                      separately (fixed in 8.9.0, and the root spec floor is ^8.9.0), so
#                      a bare `undici:` override would drag the app back onto the 7.x
#                      line. Keying on the 7 range patches every 7.x consumer while
#                      leaving 8.x alone — today that is miniflare's exact 7.28.0 pin
#                      (wrangler → mantis-edge), which is dev-server only and never
#                      ships in the server image.
overrides:
  nanoid@3: ^3.3.17
  undici@7: ^7.29.0
  sharp: ^0.35.3
  postcss: ^8.5.10
  esbuild: ^0.28.1
  joi: ^17.13.4
  ws: ^8.20.1
  uuid: ^11.1.1
  form-data: ^4.0.6
  vite: ^8.0.16
